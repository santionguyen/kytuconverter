<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chuyển đổi ký tự tùy chỉnh</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f9f9f9;
    }
    h1 {
      text-align: center;
    }
    textarea {
      width: 100%;
      height: 100px;
      font-size: 16px;
      margin-bottom: 20px;
    }
    .output {
      white-space: pre-wrap;
      background: #f0f0f0;
      padding: 10px;
      min-height: 100px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 20px;
      margin-right: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    .button-group {
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>🔤 Chuyển đổi ký tự tùy chỉnh</h1>

  <h3>Bảng thay thế (ví dụ: <code>á = ?</code>)</h3>
  <textarea id="rules" placeholder=""></textarea>

  <h3>Văn bản gốc</h3>
  <textarea id="inputText" placeholder=""></textarea>

  <button onclick="convertText()">Chuyển đổi</button>

  <h3>Kết quả</h3>
  <div class="output" id="outputText"></div>

  <div class="button-group">
    <button onclick="copyResult()">📋 Sao chép</button>
    <button onclick="saveToFile()">💾 Lưu thành .txt</button>
  </div>

  <script>
    function convertText() {
      const rulesRaw = document.getElementById("rules").value;
      const inputText = document.getElementById("inputText").value;
      let output = inputText;

      const lines = rulesRaw.split('\n');
      for (let line of lines) {
        if (line.includes('=')) {
          const [key, value] = line.split('=').map(s => s.trim());
          if (key && value) {
            const regex = new RegExp(key, 'g');
            output = output.replace(regex, value);
          }
        }
      }

      document.getElementById("outputText").innerText = output;
    }

    function copyResult() {
      const text = document.getElementById("outputText").innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert("Đã sao chép kết quả!");
      }).catch(() => {
        alert("Không thể sao chép. Hãy thử lại.");
      });
    }

    function saveToFile() {
      const text = document.getElementById("outputText").innerText;
      const blob = new Blob([text], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "ket_qua.txt";
      link.click();
    }
  </script>

</body>
</html>
